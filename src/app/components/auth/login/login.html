<div class="breadcrumb">
  <a routerLink="/">Trang chủ</a> &gt; <span>Đăng nhập</span>
</div>

<section class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🌼</div>
      <h1>Đăng nhập BHShop</h1>
      <p>Đăng nhập để đặt hoa nhanh chóng và theo dõi đơn hàng của bạn.</p>
    </div>

    @if (errorMessage()) {
      <div class="alert-error">⚠️ {{ errorMessage() }}</div>
    }

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input
          id="login-email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="vd: ngocanh@gmail.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="login-password">Mật khẩu</label>
        <div class="password-wrap">
          <input
            id="login-password"
            name="password"
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            placeholder="Nhập mật khẩu"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="toggle-pw"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          >
            {{ showPassword() ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          Đang đăng nhập...
        } @else {
          Đăng nhập
        }
      </button>
    </form>

    <div class="auth-footer">
      Chưa có tài khoản?
      <a routerLink="/register" queryParamsHandling="preserve">Đăng ký ngay</a>
    </div>
  </div>
</section>
