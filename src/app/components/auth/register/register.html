<div class="breadcrumb">
  <a routerLink="/">Trang chủ</a> &gt; <span>Đăng ký</span>
</div>

<section class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🌷</div>
      <h1>Tạo tài khoản mới</h1>
      <p>Trở thành thành viên BHShop để lưu địa chỉ giao hoa và theo dõi đơn hàng.</p>
    </div>

    @if (errorMessage()) {
      <div class="alert-error">⚠️ {{ errorMessage() }}</div>
    }

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="reg-name">Họ và tên *</label>
        <input
          id="reg-name"
          name="fullName"
          type="text"
          [(ngModel)]="fullName"
          placeholder="Nguyễn Ngọc Anh"
          required
        />
      </div>

      <div class="form-group">
        <label for="reg-email">Email *</label>
        <input
          id="reg-email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="ngocanh@gmail.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="reg-phone">Số điện thoại</label>
        <input
          id="reg-phone"
          name="phone"
          type="tel"
          [(ngModel)]="phone"
          placeholder="0901 234 567"
        />
      </div>

      <div class="form-group">
        <label for="reg-address">Địa chỉ nhận hoa mặc định</label>
        <input
          id="reg-address"
          name="address"
          type="text"
          [(ngModel)]="address"
          placeholder="Số nhà, đường, quận/huyện, TP.HCM"
        />
      </div>

      <div class="form-group">
        <label for="reg-password">Mật khẩu * (tối thiểu 6 ký tự)</label>
        <div class="password-wrap">
          <input
            id="reg-password"
            name="password"
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            placeholder="Nhập mật khẩu"
            autocomplete="new-password"
            required
          />
          <button
            type="button"
            class="toggle-pw"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          >
            {{ showPassword() ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-confirm">Xác nhận mật khẩu *</label>
        <input
          id="reg-confirm"
          name="confirmPassword"
          [type]="showPassword() ? 'text' : 'password'"
          [(ngModel)]="confirmPassword"
          placeholder="Nhập lại mật khẩu"
          autocomplete="new-password"
          required
        />
      </div>

      <button type="submit" class="btn-primary" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          Đang tạo tài khoản...
        } @else {
          Đăng ký tài khoản
        }
      </button>
    </form>

    <div class="auth-footer">
      Đã có tài khoản?
      <a routerLink="/login" queryParamsHandling="preserve">Đăng nhập</a>
    </div>
  </div>
</section>
